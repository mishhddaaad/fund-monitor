name: 每日收报

on:
  # 北京时间 15:35 工作日（A股收盘后）
  schedule:
    - cron: "35 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily_brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拉取代码（含 fund_state.json 信号状态）
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行每日收报
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_brief.py

      - name: 保存PE状态（跨日对比换挡用）
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pe_state.json
          git diff --cached --quiet || (git commit -m "chore: update pe_state [skip ci]" && git push)
